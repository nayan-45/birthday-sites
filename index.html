<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Keyuri 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- FLOATING HEARTS -->
<div class="hearts" id="hearts"></div>

<!-- ENVELOPE -->
<div id="envelope" onclick="start()">
    <img src="tulip.png.jpg">
    <p>Open this 💌</p>
</div>

<!-- MESSAGE -->
<div id="message"></div>

<!-- SLIDESHOW -->
<div id="slideshow">
    <img id="slide" src="pic1.jpg.jpeg">
</div>

<!-- FINAL PAGE -->
<div id="finalPage">
    <div class="finalText">From Nayan</div>

    <div class="heart" onclick="readHeart()">❤️</div>

    <div class="finalText">To Keyuri</div>

    <div class="signature">Forever Yours, Miss you 💌</div>

    <div id="heartMessage" class="heartText"></div>
</div>

<audio id="music" src="music.mp3"></audio>

<script src="script.js"></script>

</body>
</html>
